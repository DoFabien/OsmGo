<article class="tag-row" [class.is-current]="oldTagConfig()?.id === tag().id">
    <button class="tag-row__main" type="button" (click)="selected.emit(tag())">
        <span
            class="tag-icon"
            [style.background-color]="
                tag().markerColor || 'var(--osmgo-marker-fallback)'
            "
            aria-hidden="true"
        >
            <app-icon
                [icon]="tag().icon"
                [jsonSprites]="jsonSprites()"
                renderMode="svg"
            ></app-icon>
        </span>

        <span class="tag-copy">
            <strong>{{
                tag().lbl?.[languageTags()] || tag().lbl?.['en']
            }}</strong>
            <span class="tag-values">{{
                $safeNavigationMigration(tag()?.tags) | displayTags
            }}</span>
            @if (
                tag().description?.[languageTags()] || tag().description?.['en']
            ) {
                <span class="tag-description">
                    {{
                        tag().description?.[languageTags()] ||
                            tag().description?.['en']
                    }}
                </span>
            }
        </span>
    </button>

    <div class="tag-actions">
        @if (!isHiddenTag()) {
            <button
                mat-icon-button
                type="button"
                [class.is-bookmarked]="tag() | isBookmarked: bookmarksIds()"
                [matTooltip]="
                    (tag() | isBookmarked: bookmarksIds())
                        ? ('A11Y.REMOVE_BOOKMARK' | translate)
                        : ('A11Y.ADD_BOOKMARK' | translate)
                "
                [attr.aria-label]="
                    (tag() | isBookmarked: bookmarksIds())
                        ? ('A11Y.REMOVE_BOOKMARK' | translate)
                        : ('A11Y.ADD_BOOKMARK' | translate)
                "
                (click)="addOrRemoveBookmark(tag())"
            >
                <mat-icon
                    class="favorite-icon"
                    fontSet="material-symbols-rounded"
                    aria-hidden="true"
                >
                    favorite
                </mat-icon>
            </button>
        }

        @if (oldTagConfig()?.id === tag().id) {
            <span
                class="current-indicator"
                role="img"
                [attr.aria-label]="'A11Y.SELECTED' | translate"
            >
                <mat-icon fontSet="material-symbols-rounded"
                    >check_circle</mat-icon
                >
            </span>
        }

        @if (isHiddenTag()) {
            <button
                mat-icon-button
                class="show-action"
                type="button"
                [attr.aria-label]="'A11Y.SHOW_TAG' | translate"
                (click)="removeHiddenTag.emit(tag())"
            >
                <mat-icon fontSet="material-symbols-rounded"
                    >visibility</mat-icon
                >
            </button>
        }

        @if (showHideTagButton()) {
            <button
                mat-icon-button
                class="hide-action"
                type="button"
                [attr.aria-label]="'A11Y.HIDE_TAG' | translate"
                (click)="addHiddenTag.emit(tag())"
            >
                <mat-icon fontSet="material-symbols-rounded"
                    >visibility_off</mat-icon
                >
            </button>
        }
    </div>
</article>
