name: Validate changes

on:
    pull_request:
        branches:
            - develop
            - main

concurrency:
    group: validation-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        name: Validate web application
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Validate source and behavior
              uses: ./.github/actions/validate-web

            - name: Validate the PWA cache manifest
              run: npm run pwa:validate:built
